<!DOCTYPE html>
<html lang="ko">
  <head>
   
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
   
   

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

   
    <link
      href="https://fonts.googleapis.com/css?family=Stylish&display=swap"
      rel="stylesheet"
    />

    <title>메모장 </title>

  
     <style>
      * {
        font-family: "Stylish", sans-serif;
      }

      

      .posting-box {
        
        margin: 10px 0 30px 0;
        width: 600px;      
          padding: 0;

      }
    </style>
     
    
  </head>

  <body>
    <div class="container">
      <div class="p-5 mb-4 bg-light rounded-3">
        <div class="container-fluid py-5">
          <h1 class="display-4">나홀로 링크 메모장! <span class="badge bg-secondary">ver2.0</span></h1>

        
        <div class="posting-box">
          <div class="form-group mb-3">
            
            <input id="post-title" class="form-control" placeholder="제목을 입력해주세요" />
          </div>
          <div class="form-group mb-3">
           
            <textarea
              id="post-context"
              class="form-control"
              rows="2"
            placeholder="내용을 입력해주세요"
            ></textarea>
          </div>
          <button type="button" class="btn btn-primary" onclick="post_msg()">저장하기</button>
        </div>
      

        </div>
      </div>

      
     <div id="cards-box" class="row row-cols-1 row-cols-md-3 g-4">

 

  

</div>
    </div>

    
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      
      $(document).ready(function () {
 get_memos(); 
});

function post_msg(){

        let title = $("#post-title").val();
        let context = $("#post-context").val();
        
        $.ajax({
          type: "POST",
          url: "/memo", 
          data: { "title": title, "context": context },
          success: function (response) {
             
              get_memos();
              $("#post-title").val("");
              $("#post-context").val("");
              alert("포스팅 성공!")
           
          },
        });
      
}
function get_memos() {

  
  $.ajax({
    type: "GET",
    url: "/memo",
    data: {},
    success: function (response) {
      $("#cards-box").empty();  
      
      let memos = response["all_memos"];
      for (let i = 0; i < memos.length; i++) {
        let title = memos[i]["title"];
  let context = memos[i]["context"];
  let likes = memos[i]["likes"];
  let temp_html = `<div class="col">
                  <div class="card" id="card-${i}">
                    <div class="card-body">
                      <h5 class="card-title">${title}</h5>
                      <p class="card-text">${context}</p>
                      <p class="card-text">${likes}</p>
                      <button type="button" class="btn btn-primary btn-sm" onclick="edit_memo('${title}','${context}','${i}')">수정</button>
                      <button type="button" class="btn btn-danger btn-sm"  onclick="delete_memo('${title}')">삭제</button>
                      <button type="button" class="btn btn-link btn-sm text-decoration-none" onclick="like_memo('${title}')">
                        좋아요! <i class="bi bi-hand-thumbs-up"></i>
                      </button>
                    </div>
                  </div>
                </div>`;
        $("#cards-box").append(temp_html);
      }
    },
  });
}
function like_memo(title) {
  $.ajax({
    type: "POST",
    url: "/memo/like",
    data: { title: title },
    success: function (response) {
      get_memos();  
    },
  });
}
function delete_memo(title) {
  $.ajax({
    type: "POST",
    url: "/memo/delete",
    data: { title: title },
    success: function (response) {
      get_memos();  
      alert("삭제 완료!")
    },
  });
}
function edit_memo(title,context,i) {

  let edit_html = `<div class="card-body">
                    <input id="edit-title-${i}" class="form-control mb-2" value="${title}" />
                    <textarea id="edit-context-${i}" class="form-control mb-2" rows="2">${context}</textarea>
                    <button type="button" class="btn btn-success btn-sm" onclick="update_memo('${title}', '${i}')">저장</button>
                    
                  </div>`;
  $(`#card-${i}`).html(edit_html);

  
}
function update_memo(old_title,i){
  
  let new_title = $(`#edit-title-${i}`).val();
  let new_context = $(`#edit-context-${i}`).val();
  $.ajax({
    type: "POST",
    url: "/memo/update",
    data: { old_title: old_title, new_title: new_title, new_context: new_context },
    success: function (response) {
      get_memos();
      alert("수정 완료!")
    },
  });

}

    </script>
    
    
  </body>
</html>
